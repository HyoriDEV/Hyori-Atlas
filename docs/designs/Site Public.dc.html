<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121212;}
::selection{background:rgba(233,209,92,0.35);color:#f8f5e8;}
a{color:#e9d15c;text-decoration:none;}
a:hover{color:#d4af35;}
</style>
</helmet>
<div style="min-height:100vh;background:#121212;color:#f8f5e8;font-family:'Source Serif 4',Georgia,serif;">
  <nav style="position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;height:76px;padding:0 48px;background:rgba(18,18,18,0.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(248,245,232,0.08);">
    <a href="#" onClick="{{ goHome }}" style="display:flex;align-items:center;gap:10px;">
      <span style="width:8px;height:8px;border-radius:50%;background:#e9d15c;display:inline-block;"></span>
      <span style="font-family:'Lora',serif;font-weight:600;font-size:20px;color:#f8f5e8;letter-spacing:0.01em;">Hyori RP</span>
    </a>
    <div style="display:flex;align-items:center;gap:40px;">
      <a href="#" onClick="{{ goActualites }}" style="{{ navActualitesStyle }}" style-hover="color:#f8f5e8;">Actualités</a>
      <a href="#" onClick="{{ goGalerie }}" style="{{ navGalerieStyle }}" style-hover="color:#f8f5e8;">Galerie</a>
      <a href="#" onClick="{{ goLore }}" style="{{ navLoreStyle }}" style-hover="color:#f8f5e8;">Lore</a>
      <a href="#" onClick="{{ goReglement }}" style="{{ navReglementStyle }}" style-hover="color:#f8f5e8;">Règlement</a>
      <a href="#" style="display:inline-flex;align-items:center;gap:8px;background:#e9d15c;color:#121212;font-weight:600;font-size:15px;padding:10px 20px;border-radius:8px;" style-hover="background:#d4af35;">
        Espace Joueur
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </div>
  </nav>

  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
    <div style="padding:48px;">
      <p style="margin:0;">Bienvenue sur Hyori RP.</p>
    </div>
  </sc-if>

  <sc-if value="{{ isActualites }}" hint-placeholder-val="{{ false }}">
    <div style="max-width:820px;margin:0 auto;padding:64px 32px 120px;">
      <h1 style="font-family:'Lora',serif;font-weight:600;font-size:40px;color:#f8f5e8;margin:0 0 40px;">Actualités</h1>
      <div style="display:flex;gap:32px;border-bottom:1px solid rgba(248,245,232,0.12);margin-bottom:36px;">
        <a href="#" onClick="{{ setTabAnnonces }}" style="{{ tabAnnoncesStyle }}">Annonces</a>
        <a href="#" onClick="{{ setTabChangelog }}" style="{{ tabChangelogStyle }}">Changelog</a>
      </div>

      <sc-if value="{{ isAnnonces }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:20px;">
          <sc-for list="{{ annoncesFeed }}" as="item" hint-placeholder-count="4">
            <div style="background:#1a1a1a;border:1px solid rgba(248,245,232,0.08);border-radius:12px;padding:28px 32px;display:flex;flex-direction:column;gap:10px;">
              <div style="display:flex;align-items:center;gap:12px;">
                <span style="font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:rgba(248,245,232,0.5);">{{ item.date }}</span>
                <sc-if value="{{ showRoleBadges }}" hint-placeholder-val="{{ true }}">
                  <span style="font-size:12px;font-weight:600;color:#e9d15c;background:rgba(233,209,92,0.12);padding:4px 10px;border-radius:999px;">{{ item.author }}</span>
                </sc-if>
              </div>
              <h3 style="font-family:'Lora',serif;font-weight:600;font-size:21px;color:#f8f5e8;margin:0;">{{ item.title }}</h3>
              <p style="font-size:16px;line-height:1.65;color:rgba(248,245,232,0.72);margin:0;">{{ item.excerpt }}</p>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ isChangelog }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:20px;">
          <sc-for list="{{ changelogFeed }}" as="item" hint-placeholder-count="4">
            <div style="background:#1a1a1a;border:1px solid rgba(248,245,232,0.08);border-radius:12px;padding:28px 32px;display:flex;flex-direction:column;gap:10px;">
              <div style="display:flex;align-items:center;gap:12px;">
                <span style="font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:rgba(248,245,232,0.5);">{{ item.date }}</span>
                <sc-if value="{{ showRoleBadges }}" hint-placeholder-val="{{ true }}">
                  <span style="font-size:12px;font-weight:600;color:#e9d15c;background:rgba(233,209,92,0.12);padding:4px 10px;border-radius:999px;">{{ item.author }}</span>
                </sc-if>
              </div>
              <h3 style="font-family:'Lora',serif;font-weight:600;font-size:21px;color:#f8f5e8;margin:0;">{{ item.title }}</h3>
              <p style="font-size:16px;line-height:1.65;color:rgba(248,245,232,0.72);margin:0;">{{ item.excerpt }}</p>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ isPlaceholder }}" hint-placeholder-val="{{ false }}">
    <div style="max-width:820px;margin:0 auto;padding:64px 32px 120px;">
      <h1 style="font-family:'Lora',serif;font-weight:600;font-size:40px;color:#f8f5e8;margin:0 0 40px;">{{ placeholderLabel }}</h1>
      <div style="background:#1a1a1a;border:1px dashed rgba(248,245,232,0.18);border-radius:12px;padding:56px 32px;display:flex;align-items:center;justify-content:center;">
        <p style="font-size:15px;color:rgba(248,245,232,0.5);margin:0;">Contenu à venir.</p>
      </div>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 960},
  &quot;defaultTab&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;annonces&quot;, &quot;options&quot;: [&quot;annonces&quot;, &quot;changelog&quot;], &quot;tsType&quot;: &quot;'annonces'|'changelog'&quot;, &quot;section&quot;: &quot;Actualités&quot;},
  &quot;showRoleBadges&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Actualités&quot;},
  &quot;feedItemLimit&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 5, &quot;min&quot;: 3, &quot;max&quot;: 8, &quot;step&quot;: 1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Actualités&quot;}
}">
function navLinkStyle(active) {
  return {
    color: active ? '#f8f5e8' : 'rgba(248,245,232,0.62)',
    fontWeight: active ? 600 : 500,
    fontSize: '15px',
  };
}
function tabStyle(active) {
  return {
    color: active ? '#f8f5e8' : 'rgba(248,245,232,0.55)',
    fontWeight: active ? 600 : 500,
    fontSize: '16px',
    paddingBottom: '14px',
    borderBottom: active ? '2px solid #e9d15c' : '2px solid transparent',
    cursor: 'pointer',
  };
}

class Component extends DCLogic {
  state = { page: 'home', tab: null, placeholderLabel: '' };

  goHome = () => this.setState({ page: 'home' });
  goActualites = () => this.setState(s => ({ page: 'actualites', tab: s.tab || (this.props.defaultTab ?? 'annonces') }));
  goPlaceholder = (label) => this.setState({ page: 'placeholder', placeholderLabel: label });
  setTab = (tab) => this.setState({ tab });

  renderVals() {
    const tab = this.state.tab || (this.props.defaultTab ?? 'annonces');
    const showRoleBadges = this.props.showRoleBadges ?? true;
    const limit = this.props.feedItemLimit ?? 5;

    const annonces = [
      { date: '29 juillet 2026', author: 'Administration', title: 'Ouverture des candidatures Whitelist — Saison 3', excerpt: "La liste d'attente rouvre ses portes. Les joueurs ayant lié leurs comptes Discord et Minecraft peuvent désormais candidater à l'entretien de whitelist." },
      { date: '14 juillet 2026', author: 'Administration', title: 'Refonte du Règlement RP', excerpt: "Le règlement a été entièrement retravaillé pour clarifier les sanctions liées aux conflits inter-joueurs et au powergaming." },
      { date: '2 juillet 2026', author: 'Administration', title: 'Recrutement — Équipe Suivi RP', excerpt: "Nous recherchons deux membres supplémentaires pour accompagner les joueurs whitelistés dans l'écriture de leur histoire." },
      { date: '18 juin 2026', author: 'Administration', title: 'Nouvelle carte du serveur dévoilée', excerpt: "La carte du Japon féodal reçoit une extension vers les provinces du nord, avec trois nouveaux villages jouables." },
      { date: '5 juin 2026', author: 'Administration', title: 'Bilan de la Saison 2', excerpt: "Retour sur trois mois de roleplay : plus de 40 personnages validés et une centaine d'entretiens menés par l'équipe." },
      { date: '22 mai 2026', author: 'Administration', title: 'Calendrier des entretiens vocaux', excerpt: "Les créneaux de la semaine sont désormais visibles directement depuis l'Espace Joueur." },
      { date: '9 mai 2026', author: 'Administration', title: 'Charte de bonne conduite Discord', excerpt: "Un rappel des règles de comportement sur le serveur Discord accompagne désormais chaque nouvelle inscription." },
    ];

    const changelog = [
      { date: '31 juillet 2026', author: 'Développeur', title: 'v0.9.2 — Corrections de la fiche personnage', excerpt: "Résolution d'un bug empêchant la sauvegarde de la carte de compétences au-delà de 45 points répartis." },
      { date: '20 juillet 2026', author: 'Développeur', title: 'v0.9.1 — Ajout du suivi RP', excerpt: "Le chat de suivi RP est désormais actif pour les joueurs inscrits à la whitelist, avec notifications liées aux tickets." },
      { date: '9 juillet 2026', author: 'Administration', title: "v0.9.0 — Lancement de la bêta fermée d'Hyori Atlas", excerpt: "Premier déploiement de l'espace joueur : onboarding, entretien whitelist et fiche personnage." },
      { date: '28 juin 2026', author: 'Développeur', title: 'v0.8.4 — Système de tickets', excerpt: "Ajout des catégories de tickets et de l'archivage automatique après résolution." },
      { date: '15 juin 2026', author: 'Administration', title: 'v0.8.0 — Authentification Discord', excerpt: "Mise en place de la connexion via Discord OAuth2 et de l'enregistrement automatique des comptes." },
      { date: '2 juin 2026', author: 'Développeur', title: 'v0.7.2 — Optimisation des temps de chargement', excerpt: "Réduction de 40% du temps de chargement de l'Atlas des joueurs côté staff." },
      { date: '19 mai 2026', author: 'Développeur', title: 'v0.7.0 — Mise en place de Prisma Studio', excerpt: "L'équipe technique dispose désormais d'une interface d'administration directe de la base de données." },
    ];

    const isHome = this.state.page === 'home';
    const isActualites = this.state.page === 'actualites';
    const isPlaceholder = this.state.page === 'placeholder';
    const isAnnonces = tab === 'annonces';
    const isChangelog = tab === 'changelog';

    return {
      goHome: this.goHome,
      goActualites: this.goActualites,
      goGalerie: () => this.goPlaceholder('Galerie'),
      goLore: () => this.goPlaceholder('Lore'),
      goReglement: () => this.goPlaceholder('Règlement'),
      setTabAnnonces: () => this.setTab('annonces'),
      setTabChangelog: () => this.setTab('changelog'),
      isHome, isActualites, isPlaceholder, isAnnonces, isChangelog,
      placeholderLabel: this.state.placeholderLabel,
      showRoleBadges,
      annoncesFeed: annonces.slice(0, limit),
      changelogFeed: changelog.slice(0, limit),
      navActualitesStyle: navLinkStyle(isActualites),
      navGalerieStyle: navLinkStyle(isPlaceholder && this.state.placeholderLabel === 'Galerie'),
      navLoreStyle: navLinkStyle(isPlaceholder && this.state.placeholderLabel === 'Lore'),
      navReglementStyle: navLinkStyle(isPlaceholder && this.state.placeholderLabel === 'Règlement'),
      tabAnnoncesStyle: tabStyle(isAnnonces),
      tabChangelogStyle: tabStyle(isChangelog),
    };
  }
}

</script>
</body>
</html>
